# Run ZeroClaw behind a Warden WORKER, driven by a Warden CONTROL PLANE.
#
# Topology (the real control-plane / data-plane split):
#   control-plane  — serves allow/deny policy and aggregates the worker's
#                    analytics into a fleet dashboard. Holds NO secrets.
#   warden (worker)— the data plane ZeroClaw's egress flows through: pulls policy
#                    from the control plane (managed; boots fail-closed until
#                    first pull), terminates TLS, logs every call, forwards
#                    analytics to the control plane.
#   zeroclaw       — isolated on an INTERNAL-ONLY network; its sole route out is
#                    the worker.
#
# ZeroClaw is a Rust binary; its HTTP client (reqwest) honors HTTP(S)_PROXY and
# SSL_CERT_FILE natively, so NO Node fetch workaround is needed here.
#
# Warden is pulled from Docker Hub (ethosagent/warden) — no local build.
#
# Prereq (run from the repo root): generate the bake-once CA into ./certs:
#   OUT_DIR=deploy/compose/certs ./scripts/gen-certs.sh
#
# Per-worker tokens (docs/control-plane.md#worker-token-cli): the worker holds its
# OWN revocable wwt_ token and the control plane runs strict (--require-worker-tokens).
# The one-shot cp-bootstrap service registers it before the control plane starts.
# The defaults are public dev placeholders (see .env.example); set real values
# anywhere that is not a laptop (WARDEN_WORKER_1_TOKEN, WARDEN_CP_ADMIN_TOKEN).
#
# Run (from the repo root):
#   docker compose -f deploy/compose/docker-compose.zeroclaw.yml up
#
# ZeroClaw API: http://localhost:42617
# Fleet dashboard (control plane): https://localhost:7070/dashboard/  (proxy-CA cert — trust it)
# Worker-local dashboard:          http://localhost:9090/dashboard/

services:
  # One-shot: registers the worker's per-worker token (--from-env, so the plaintext
  # never appears on a command line or in a log) on the control plane's state
  # volume as the image's warden user, then exits. Re-running is a no-op (same
  # name and value), so every `up` is safe. See docs/control-plane.md#worker-token-cli.
  cp-bootstrap:
    image: ethosagent/warden:${WARDEN_VERSION:-0.3.0}
    restart: "no"
    network_mode: none
    environment:
      - WARDEN_WORKER_1_TOKEN=${WARDEN_WORKER_1_TOKEN:-wwt_devonlyworkeronetokennotarealsecretxxxxxxxxxxxxxxxxx}
    volumes:
      - zeroclaw-cp-data:/data
    entrypoint:
      - sh
      - -c
      - |
        set -e
        warden control-plane token create --from-env WARDEN_WORKER_1_TOKEN --name w1 --proxy-id zeroclaw-worker --state-dir=/data

  control-plane:
    image: ethosagent/warden:${WARDEN_VERSION:-0.3.0}
    depends_on:
      cp-bootstrap:
        condition: service_completed_successfully
    networks: [cp-net]
    ports:
      - "127.0.0.1:7070:7070"                  # fleet dashboard + /policy + /central/ingest
    environment:
      # The CP's own bearer for dashboard writes (policy, secrets). Not a worker credential.
      - WARDEN_CP_ADMIN_TOKEN=${WARDEN_CP_ADMIN_TOKEN:-dev-cp-admin-token}
    volumes:
      - ../../configs/config.cp-served.yaml:/etc/warden/config.yaml:ro   # served policy
      - ./certs:/etc/warden/certs:ro
      - zeroclaw-cp-data:/data       # writable state: fleet analytics DB + editable served config
    command:
      - control-plane
      - "--config=/etc/warden/config.yaml"
      - "--state-dir=/data"
      - "--listen=0.0.0.0:7070"
      - "--require-worker-tokens"   # strict: wwt_ worker tokens only (needs --state-dir and TLS)
      - "--admin-token-env=WARDEN_CP_ADMIN_TOKEN"
      - "--ca-cert=/etc/warden/certs/proxy-ca.crt"   # mint the CP server cert from the proxy CA
      - "--ca-key=/etc/warden/certs/proxy-ca.key"
      - "--tls-host=control-plane,localhost,127.0.0.1"

  warden:
    image: ethosagent/warden:${WARDEN_VERSION:-0.3.0}
    depends_on:
      control-plane:
        condition: service_started
      cp-bootstrap:
        condition: service_completed_successfully
    networks: [zeroclaw-internal, egress, cp-net]
    ports:
      - "127.0.0.1:9090:9090"                 # dashboard + /metrics (host-only; NOT reachable by ZeroClaw)
    environment:
      # This worker's own token, under the in-container name the worker config
      # reads (controlPlane.tokenEnv and central.tokenEnv).
      - WARDEN_WORKER_TOKEN=${WARDEN_WORKER_1_TOKEN:-wwt_devonlyworkeronetokennotarealsecretxxxxxxxxxxxxxxxxx}
      - WARDEN_ADMIN_TOKEN=${WARDEN_ADMIN_TOKEN:-dev-admin-token}
      - WARDEN_PROXY_ID=zeroclaw-worker   # labels this worker in the fleet view
    volumes:
      - ../../configs/config.recipe-worker.yaml:/etc/warden/config.yaml:ro   # managed: policy from the CP
      - ./certs:/etc/warden/certs:ro
      - warden-data:/data            # persist the analytics db across restarts/redeploys
    command:
      - "run"
      - "--config=/etc/warden/config.yaml"
      - "--listen=0.0.0.0:8080"
      - "--ca-cert=/etc/warden/certs/proxy-ca.crt"   # TLS terminate for full visibility; omit both for blind tunnel (domain-only)
      - "--ca-key=/etc/warden/certs/proxy-ca.key"
      - "--admin-listen=0.0.0.0:9090"
      - "--admin-token-env=WARDEN_ADMIN_TOKEN"
      - "--db=/data/warden.db"

  zeroclaw:
    # Pinned by semver tag + digest — upstream now publishes semver release tags;
    # the tag is for readability, the digest keeps the pin immutable.
    image: ghcr.io/zeroclaw-labs/zeroclaw:v0.8.5@sha256:ba9c76b9287c125ec9cc9a8270654f2c0efbd610eef3e00eece3cd11f6c083e0
    # ARM64 note: if the distroless image exits immediately, switch to the Debian
    # variant: image: ghcr.io/zeroclaw-labs/zeroclaw:v0.8.5-debian
    depends_on: [warden]
    networks: [zeroclaw-internal]     # internal ONLY — no internet except via Warden
    environment:
      # 42617 is ZeroClaw's container gateway port (per upstream docker-compose.yml).
      - ZEROCLAW_gateway__allow_public_bind=true   # required for container networking
      - ZEROCLAW_gateway__port=42617
      # Hand ZeroClaw a PLACEHOLDER, not a real key — Warden swaps it at the edge.
      # Map this placeholder to a real env var in configs/config.recipe.yaml under
      # `secrets:` once you lock the allowlist down (see the recipe doc).
      - ZEROCLAW_providers__models__openrouter__default__api_key=openrouter_secret_001
      # Route ALL egress through Warden (both cases for tools that read lowercase)
      - HTTP_PROXY=http://warden:8080
      - HTTPS_PROXY=http://warden:8080
      - http_proxy=http://warden:8080
      - https_proxy=http://warden:8080
      - NO_PROXY=localhost,127.0.0.1,::1,warden
      - no_proxy=localhost,127.0.0.1,::1,warden
      # Trust Warden's CA so its terminated-TLS leaf certs are accepted.
      # reqwest (Rust) reads SSL_CERT_FILE; the others cover any bundled tools.
      - SSL_CERT_FILE=/etc/warden/certs/proxy-ca.crt
      - REQUESTS_CA_BUNDLE=/etc/warden/certs/proxy-ca.crt
      - CURL_CA_BUNDLE=/etc/warden/certs/proxy-ca.crt
    volumes:
      - zeroclaw-data:/zeroclaw-data
      - ./certs/proxy-ca.crt:/etc/warden/certs/proxy-ca.crt:ro

  # UI forwarder: an `internal: true` network blocks host port-publishing, so the
  # ZeroClaw gateway is exposed via this tiny socat hop instead. It forwards
  # host:42617 -> zeroclaw:42617 WITHOUT giving ZeroClaw an internet route —
  # ZeroClaw stays internal-only; only this dumb forwarder touches the frontend.
  ui:
    image: alpine/socat:1.8.1.3
    depends_on: [zeroclaw]
    networks: [zeroclaw-internal, frontend]
    ports:
      - "42617:42617"
    command: ["TCP-LISTEN:42617,fork,reuseaddr", "TCP:zeroclaw:42617"]

networks:
  # internal: true → containers here get NO route to the internet. ZeroClaw is here only.
  zeroclaw-internal:
    internal: true
  # egress carries real internet and is attached ONLY to Warden.
  egress:
    driver: bridge
  # Control-plane bus: worker ↔ control plane, plus the host-published dashboard.
  cp-net:
    driver: bridge
  # frontend carries ONLY the inbound UI forwarder + its host-published port.
  # ZeroClaw is never attached here, so it gains no internet route.
  frontend:
    driver: bridge

volumes:
  # persistent Warden analytics db — survives `up` / container recreate.
  warden-data:
  # the control plane's writable state: fleet analytics db + editable served config.
  zeroclaw-cp-data:
  # ZeroClaw workspace + config.
  zeroclaw-data:
