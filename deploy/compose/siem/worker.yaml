# Managed WORKER for the base dev harness (docker-compose.yml).
#
# Allow/deny policy comes ONLY from the control plane (config.cp-served.yaml).
# Boots fail-closed until the first policy pull. Secrets + response scanning stay
# LOCAL to this worker and never cross to the control plane.

logging:
  level: info
  format: json

# Non-MCP HTTP response DLP scanning (detect + log, never block).
responseScan:
  enabled: true
  mode: monitor
  maxBodyBytes: 1048576
  evidence: true
  pii:
    phone: false

# Real keys live with the worker; the agent holds only the placeholders.
secrets:
  - placeholder: openai_secret_001
    envVar: OPENAI_API_KEY
  - placeholder: anthropic_secret_001
    envVar: ANTHROPIC_API_KEY

controlPlane:
  endpoint: https://control-plane:7070/policy
  tokenEnv: WARDEN_CP_TOKEN
  caCert: /etc/warden/certs/proxy-ca.crt
  longPollWait: 30s
  heartbeatInterval: 10s
  localOnly: false

central:
  mode: worker
  endpoint: https://control-plane:7070/central/ingest
  tokenEnv: WARDEN_CP_TOKEN
  proxyID: ${WARDEN_PROXY_ID}
  caCert: /etc/warden/certs/proxy-ca.crt
  mcpPushInterval: 30s

# Identity verification (OFF when this block is absent: no token is read or
# verified and behavior is byte-identical to before). Attribute mode verifies a
# user token and records who made the request; it never blocks. The block holds
# no secrets. Phase 1 modes: off | attribute ("require" arrives in Phase 2).
# Per-agent override: `identity: off|attribute` on an agents[] entry.
#identity:
#  defaultMode: attribute                  # off | attribute (default off)
#  issuer: http://localhost:5556/dex       # dev only: plain http needs internalIssuerURL
#  internalIssuerURL: http://dex:5556      # dev-only split-horizon: origin containers use to reach the issuer
#  audience: warden
#  allowedAZP: [agent-harness, warden-cli] # empty = no azp check
#  groupsClaim: groups
#  clockSkewSeconds: 60                    # 0..300 (0 = default 60)
#  maxTokenTTLSeconds: 3600                # >0 overrides the default 3600

# Production form: an
# https issuer and no internalIssuerURL. The block holds no secrets.
#identity:
#  defaultMode: attribute                  # off | attribute (default off)
#  issuer: https://idp.example.com
#  audience: warden
#  allowedAZP: [agent-harness, warden-cli] # empty = no azp check
#  groupsClaim: groups

# SIEM stream (docker-compose.siem.yml): one JSON decision line per stored
# analytics event, written to a rotating file on the volume the compose override
# shares with Vector. Node-local and restart-only. docs/siem.md.
audit:
  jsonLog:
    enabled: true
    output: file
    path: /data/audit/decisions.jsonl   # /data is the worker's writable volume
    maxSizeMB: 100
    maxBackups: 10
    maxAgeDays: 30
    fileMode: 0600                      # octal; Vector runs as root here. See docs/siem.md for 0640 and a shared group
    query: drop                         # keys: also ship query parameter NAMES (never values)
