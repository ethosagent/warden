# Warden control plane + two data-plane workers (one binary, two roles).
#
# Topology:
#   control-plane  — serves ALLOW/DENY policy to workers and aggregates their
#                    analytics into a fleet dashboard. Holds NO secrets.
#   worker-1/2     — pull policy from the control plane, enforce it on their
#                    agent's egress, and forward analytics back. Secrets stay local.
#   agent-1/2      — synthetic load (curl loop) routed through its worker, so the
#                    fleet dashboard shows real per-worker traffic.
#
# Today these run together (one compose / one host). Because the two roles are
# separate processes that only talk over HTTPS, deploying the control plane on
# its own host later is just moving a service — no code change.
#
# Prereq (from repo root): generate the bake-once proxy CA into the mounted dir.
# The control plane mints its server cert from this same CA; workers trust it via
# controlPlane.caCert / central.caCert (see configs/config.worker.yaml).
#   OUT_DIR=deploy/compose/certs ./scripts/gen-certs.sh
#
# Per-worker tokens (docs/control-plane.md#worker-token-cli): every worker holds
# its OWN revocable wwt_ token, bound to its proxy id, and the control plane runs
# strict (--require-worker-tokens): no shared worker token exists. The one-shot
# cp-bootstrap service registers each worker's token on the control plane's state
# volume before the control plane and the workers start. Dashboard writes use the
# control plane's own admin token (WARDEN_CP_ADMIN_TOKEN).
#
# The tokens come from your shell or a .env file (see deploy/compose/.env.example);
# the defaults below are public dev placeholders: set real values anywhere that
# is not a laptop. Generate one with:  echo wwt_$(head -c32 /dev/urandom | base32 | tr -d = | tr A-Z a-z | head -c52)
#
# Run (from repo root):
#   docker compose -f deploy/compose/docker-compose.control-plane.yml up
#
# Fleet dashboard: https://localhost:7070/dashboard/  (cert signed by the proxy
#   CA — your browser will warn; trust it or curl with --cacert deploy/compose/certs/proxy-ca.crt)
# Per-worker dashboards: http://localhost:9091/dashboard/ and :9092

services:
  # One-shot: registers each worker's token (--from-env, so the plaintext never
  # appears on a command line or in a log) in <state-dir>/warden-cp.db on the
  # shared cp-data volume, as the image's warden user, then exits. Re-running is
  # a no-op (same name and value), so every `up` is safe.
  cp-bootstrap:
    image: ethosagent/warden:${WARDEN_VERSION:-0.3.0}
    restart: "no"
    network_mode: none
    environment:
      - WARDEN_WORKER_1_TOKEN=${WARDEN_WORKER_1_TOKEN:-wwt_devonlyworkeronetokennotarealsecretxxxxxxxxxxxxxxxxx}
      - WARDEN_WORKER_2_TOKEN=${WARDEN_WORKER_2_TOKEN:-wwt_devonlyworkertwotokennotarealsecretxxxxxxxxxxxxxxxxx}
    volumes:
      - cp-data:/data
    entrypoint:
      - sh
      - -c
      - |
        set -e
        warden control-plane token create --from-env WARDEN_WORKER_1_TOKEN --name w1 --proxy-id worker-1 --state-dir=/data
        warden control-plane token create --from-env WARDEN_WORKER_2_TOKEN --name w2 --proxy-id worker-2 --state-dir=/data

  control-plane:
    image: ethosagent/warden:${WARDEN_VERSION:-0.3.0}
    depends_on:
      cp-bootstrap:
        condition: service_completed_successfully
    networks: [cp-net]
    ports:
      - "127.0.0.1:7070:7070"
    environment:
      # The CP's own bearer for dashboard writes (policy, secrets). Not a worker credential.
      - WARDEN_CP_ADMIN_TOKEN=${WARDEN_CP_ADMIN_TOKEN:-dev-cp-admin-token}
    volumes:
      # --config is the read-only SEED: on first start the control plane copies it
      # to /data/config.yaml (a writable named volume, owned by the container user)
      # and serves+edits that copy, so dashboard policy/settings edits persist and
      # do not need to rewrite this read-only mount. See --state-dir below.
      - ../../configs/config.control-plane.yaml:/etc/warden/config.yaml:ro
      - ./certs:/etc/warden/certs:ro
      - cp-data:/data
      # Backup sets (docs/runbooks/backup-restore.md). Must NOT be inside
      # --state-dir. Mounted always; written only once the --backup-* flags below
      # are enabled. A fresh named volume is root-owned, so give it to the image's
      # warden user once before enabling them:
      #   docker compose -f deploy/compose/docker-compose.control-plane.yml run --rm --no-deps \
      #     --user root --entrypoint chown control-plane warden:warden /backups
      # Copy complete sets off this host (cp-backups lives on the same disk as cp-data).
      - cp-backups:/backups
    command:
      - control-plane
      - "--config=/etc/warden/config.yaml"
      - "--state-dir=/data"   # seed → /data/config.yaml; serve+edit the writable copy
      - "--listen=0.0.0.0:7070"
      - "--require-worker-tokens"   # strict: wwt_ worker tokens only (needs --state-dir and TLS)
      - "--admin-token-env=WARDEN_CP_ADMIN_TOKEN"
      - "--ca-cert=/etc/warden/certs/proxy-ca.crt"   # mint the CP server cert from the proxy CA
      - "--ca-key=/etc/warden/certs/proxy-ca.key"
      - "--tls-host=control-plane,localhost,127.0.0.1"
      # Scheduled backups: uncomment to enable (needs --state-dir; see the volume above).
      # - "--backup-dir=/backups"
      # - "--backup-interval=24h"      # default 24h, minimum 1h
      # - "--backup-keep=7"            # complete sets kept, default 7
      # - "--backup-include=cp,alerts,config"   # fleet is opt-in

  worker-1:
    image: ethosagent/warden:${WARDEN_VERSION:-0.3.0}
    depends_on:
      control-plane:
        condition: service_started
      cp-bootstrap:
        condition: service_completed_successfully
    # Identity verification (docs/control-plane.md): a worker with an identity: block
    # must reach the OIDC issuer, over `egress` (public issuer) or `cp-net`
    # (compose-network issuer via identity.internalIssuerURL). Operator-set value.
    networks: [cp-net, egress, w1-internal]
    ports:
      - "127.0.0.1:9091:9090"
    environment:
      # This worker's own token, under the in-container name config.worker.yaml
      # reads (controlPlane.tokenEnv and central.tokenEnv).
      - WARDEN_WORKER_TOKEN=${WARDEN_WORKER_1_TOKEN:-wwt_devonlyworkeronetokennotarealsecretxxxxxxxxxxxxxxxxx}
      - WARDEN_ADMIN_TOKEN=${WARDEN_ADMIN_TOKEN:-dev-admin-token}
      - WARDEN_PROXY_ID=worker-1
      # The worker holds its own secret locally (never sent to the control plane).
      # This demo value satisfies the secrets mapping in config.worker.yaml.
      - EXAMPLE_SECRET=demo-local-secret-not-a-real-key
    volumes:
      - ../../configs/config.worker.yaml:/etc/warden/config.yaml:ro
      - ./certs:/etc/warden/certs:ro
      - worker1-data:/data
    command:
      - run
      - "--config=/etc/warden/config.yaml"
      - "--listen=0.0.0.0:8080"
      - "--ca-cert=/etc/warden/certs/proxy-ca.crt"
      - "--ca-key=/etc/warden/certs/proxy-ca.key"
      - "--admin-listen=0.0.0.0:9090"
      - "--admin-token-env=WARDEN_ADMIN_TOKEN"
      - "--db=/data/warden.db"

  worker-2:
    image: ethosagent/warden:${WARDEN_VERSION:-0.3.0}
    depends_on:
      control-plane:
        condition: service_started
      cp-bootstrap:
        condition: service_completed_successfully
    # Identity verification (docs/control-plane.md): a worker with an identity: block
    # must reach the OIDC issuer, over `egress` (public issuer) or `cp-net`
    # (compose-network issuer via identity.internalIssuerURL). Operator-set value.
    networks: [cp-net, egress, w2-internal]
    ports:
      - "127.0.0.1:9092:9090"
    environment:
      # This worker's own token, under the in-container name config.worker.yaml
      # reads (controlPlane.tokenEnv and central.tokenEnv).
      - WARDEN_WORKER_TOKEN=${WARDEN_WORKER_2_TOKEN:-wwt_devonlyworkertwotokennotarealsecretxxxxxxxxxxxxxxxxx}
      - WARDEN_ADMIN_TOKEN=${WARDEN_ADMIN_TOKEN:-dev-admin-token}
      - WARDEN_PROXY_ID=worker-2
      - EXAMPLE_SECRET=demo-local-secret-not-a-real-key
    volumes:
      - ../../configs/config.worker.yaml:/etc/warden/config.yaml:ro
      - ./certs:/etc/warden/certs:ro
      - worker2-data:/data
    command:
      - run
      - "--config=/etc/warden/config.yaml"
      - "--listen=0.0.0.0:8080"
      - "--ca-cert=/etc/warden/certs/proxy-ca.crt"
      - "--ca-key=/etc/warden/certs/proxy-ca.key"
      - "--admin-listen=0.0.0.0:9090"
      - "--admin-token-env=WARDEN_ADMIN_TOKEN"
      - "--db=/data/warden.db"

  agent-1:
    image: curlimages/curl:8.22.0
    depends_on: [worker-1]
    networks: [w1-internal]            # internal only — sole route out is worker-1
    environment:
      - HTTP_PROXY=http://worker-1:8080
      - HTTPS_PROXY=http://worker-1:8080
      - CURL_CA_BUNDLE=/etc/warden/certs/proxy-ca.crt   # trust worker-1's TLS termination
    volumes:
      - ./certs/proxy-ca.crt:/etc/warden/certs/proxy-ca.crt:ro
    entrypoint: ["sh", "-c", "while true; do curl -s -o /dev/null -w 'agent-1 -> %{http_code}\\n' https://api.github.com/zen; sleep 5; done"]

  agent-2:
    image: curlimages/curl:8.22.0
    depends_on: [worker-2]
    networks: [w2-internal]
    environment:
      - HTTP_PROXY=http://worker-2:8080
      - HTTPS_PROXY=http://worker-2:8080
      - CURL_CA_BUNDLE=/etc/warden/certs/proxy-ca.crt
    volumes:
      - ./certs/proxy-ca.crt:/etc/warden/certs/proxy-ca.crt:ro
    entrypoint: ["sh", "-c", "while true; do curl -s -o /dev/null -w 'agent-2 -> %{http_code}\\n' https://api.github.com/zen; sleep 7; done"]

networks:
  # Control-plane bus: workers reach the control plane here; the host reaches the
  # fleet dashboard via the published port. The control plane needs no internet.
  cp-net:
    driver: bridge
  # Worker route to the internet (attached to workers only, never agents).
  egress:
    driver: bridge
  # Per-worker agent isolation: each agent's only route out is its worker.
  w1-internal:
    internal: true
  w2-internal:
    internal: true

volumes:
  cp-data:
  cp-backups:
  worker1-data:
  worker2-data:
