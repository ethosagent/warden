# Opt-in reference identity provider: a pinned Dex in front of a seeded OpenLDAP.
# Nothing in the base compose files references it; an operator with another OIDC
# issuer simply does not merge this file. Dex and LDAP never join an agent network.
#
# Dev usage (works standalone or merged):
#   set -a; . deploy/compose/dex/.env.example; set +a
#   docker compose -f docker-compose.control-plane.yml -f docker-compose.identity.yml up
#   docker compose -f docker-compose.yml -f docker-compose.identity.yml up
#
# Containers reach Dex at http://dex:5556 (internalIssuerURL); the host reaches
# it at http://localhost:5556 (the dev issuer origin). Telemetry 5558 stays unpublished.
services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1@sha256:bc7cfce7c17f52864e2bb2a4dc1d2f86a41e3019f6d42e81d92a301fad0c8a1d
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.dev.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    ports:
      - "127.0.0.1:5556:5556"
    networks: [cp-net, idp-net]
    environment:
      - WARDEN_CONSOLE_DEX_CLIENT_SECRET=${WARDEN_CONSOLE_DEX_CLIENT_SECRET:?set it (see dex/.env.example)}
      - WARDEN_DEX_CLIENT_SECRET=${WARDEN_DEX_CLIENT_SECRET:?set it (see dex/.env.example)}
      - HARNESS_DEX_CLIENT_SECRET=${HARNESS_DEX_CLIENT_SECRET:?set it (see dex/.env.example)}
      - LDAP_BIND_PW=${LDAP_BIND_PW:?set it (see dex/.env.example)}
    # Telemetry listener (5558, unpublished) answers /healthz; the image ships busybox wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5558/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      ldap:
        condition: service_healthy

  ldap:
    image: bitnamilegacy/openldap:2.6.10@sha256:687f14a22b5c74fb057a57221acdbe7b8c82e2d3619fc380db3af48ec4aa04ed
    environment:
      - LDAP_ROOT=dc=example,dc=org
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD:?set it (see dex/.env.example)}
      - LDAP_PORT_NUMBER=389
      - LDAP_SKIP_DEFAULT_TREE=yes
      - LDAP_CUSTOM_LDIF_DIR=/ldifs
    volumes:
      - ./dex/seed.ldif:/ldifs/seed.ldif:ro
    networks: [idp-net]
    healthcheck:
      test: ["CMD-SHELL", 'ldapsearch -x -H ldap://127.0.0.1:389 -b dc=example,dc=org -D cn=admin,dc=example,dc=org -w "$$LDAP_ADMIN_PASSWORD" uid=alice dn | grep -q "^dn: uid=alice"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  # Same name as in docker-compose.control-plane.yml so the files merge. Only the
  # driver is set here: the e2e override tightens it to internal and must win.
  cp-net:
    driver: bridge
  # Dex-to-directory link. internal: no route to the host or the internet.
  idp-net:
    internal: true
  # Upstream connectors (GitHub, Google, OIDC) need Dex to reach out; add a network
  # for that here and attach it to dex only, for example:
  # upstream-egress: {}

volumes:
  dex-data: {}
