# Signed policy bundles for the control-plane recipe (W-P2-SBND-07): an OVERRIDE
# over docker-compose.control-plane.yml. Run (from repo root):
#
#   docker compose -f deploy/compose/docker-compose.control-plane.yml \
#                  -f deploy/compose/docker-compose.bundles.yml up
#
# What it changes vs the base stack:
#   - The control plane runs with --policy-store=versioned and --bundles=offer
#     and keys.enabled (configs/config.control-plane.bundles.yaml), so it signs
#     what it serves on GET /policy with its bundle key. `offer` serves the
#     envelope to workers that ask for it and the unsigned policy to the rest,
#     so nothing breaks while a fleet is being pinned. Move to `require` only
#     once every worker pins (docs/runbooks/key-rotation.md, "Rollout order").
#   - cp-pins is a one-shot, run as the image's own warden user, that waits for
#     the control plane's first start (which creates the keys), then exports the
#     PUBLIC bundle JWKS (active + next, never private material) into the
#     cp-pins volume. The volume is mounted at /data, which the image owns as
#     warden, so a fresh volume inherits that ownership.
#   - Each worker starts only after cp-pins and mounts the pin file; its config
#     is configs/config.worker.bundles.yaml (the stock worker config plus
#     controlPlane.bundleKeysFile), so it applies only bundles that verify.
#
# Rotating the bundle key later is the staged flow of the runbook: re-run the
# export of cp-pins into the volume, restart the workers so they pin both keys,
# then `keys rotate --purpose bundle --stage` and `--activate`.

services:
  control-plane:
    volumes:
      - ../../configs/config.control-plane.bundles.yaml:/etc/warden/config.yaml:ro
    command:
      - control-plane
      - "--config=/etc/warden/config.yaml"
      - "--state-dir=/data"
      - "--listen=0.0.0.0:7070"
      - "--require-worker-certs"
      - "--admin-token-env=WARDEN_CP_ADMIN_TOKEN"
      - "--ca-cert=/etc/warden/certs/proxy-ca.crt"
      - "--ca-key=/etc/warden/certs/proxy-ca.key"
      - "--tls-host=control-plane,localhost,127.0.0.1"
      - "--policy-store=versioned"
      - "--bundles=offer"

  cp-pins:
    image: ethosagent/warden:${WARDEN_VERSION:-0.3.0}
    restart: "no"
    network_mode: none
    depends_on:
      control-plane:
        condition: service_started
    volumes:
      - ../../configs/config.control-plane.bundles.yaml:/etc/warden/config.yaml:ro
      - cp-data:/state          # the control plane's state dir; the export only reads public metadata
      - cp-pins:/data           # warden-owned in the image, so the fresh volume is writable
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for i in $$(seq 1 60); do
          if warden control-plane keys export --purpose bundle --state-dir /state \
               --config /etc/warden/config.yaml > /data/bundle-keys.json.tmp 2>/dev/null; then
            chmod 0644 /data/bundle-keys.json.tmp
            mv /data/bundle-keys.json.tmp /data/bundle-keys.json
            echo "pinned bundle keys:"
            cat /data/bundle-keys.json
            exit 0
          fi
          sleep 1
        done
        echo "the control plane never created its bundle keys" >&2
        exit 1

  worker-1:
    depends_on:
      cp-pins:
        condition: service_completed_successfully
    volumes:
      - ../../configs/config.worker.bundles.yaml:/etc/warden/config.yaml:ro
      - cp-pins:/etc/warden/pins:ro

  worker-2:
    depends_on:
      cp-pins:
        condition: service_completed_successfully
    volumes:
      - ../../configs/config.worker.bundles.yaml:/etc/warden/config.yaml:ro
      - cp-pins:/etc/warden/pins:ro

volumes:
  cp-pins:
