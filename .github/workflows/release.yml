name: release

# On a version tag, build cross-platform binaries, publish a GitHub Release, and
# sign the checksums with KEYLESS cosign (Sigstore via GitHub OIDC) — no
# long-lived signing keys; the signing identity is this workflow.
# A CycloneDX SBOM (syft) is also attached; its hash is in the signed
# checksums.txt, so the signature covers the SBOM too.
# Each artifact also gets a SLSA build-provenance attestation; verify with:
#   gh attestation verify warden-linux-amd64 --repo ethosagent/warden
#
# A multi-arch image (linux/amd64 + linux/arm64) is also built and pushed to
# Docker Hub (docker.io/ethosagent/warden), with an SBOM + SLSA provenance on the
# digest and a keyless cosign signature. Verify:
#   cosign verify ethosagent/warden:<tag> \
#     --certificate-identity-regexp 'https://github.com/ethosagent/warden/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# Order (#421): the image job pushes BY DIGEST ONLY — no tags — so nothing new
# on Docker Hub is usable while the L2 e2e suite (.github/workflows/e2e.yml)
# runs on that digest. Only the publish job, which waits for e2e, adds the
# v{version} and latest tags to that same digest and signs it; the GitHub
# Release comes last. A failed e2e leaves the digest untagged and unsigned.
#
# Verify a downloaded release:
#   cosign verify-blob \
#     --certificate checksums.txt.pem \
#     --signature checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/ethosagent/warden/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
#   # then confirm your binary's line in the now-trusted checksums.txt:
#   sha256sum --check --ignore-missing checksums.txt

on:
  push:
    tags:
      - 'v*'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout; the push authenticates with Docker Hub secrets
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed by digest only — no tags — so no v* or latest tag exists on
      # Docker Hub until publish adds them after e2e has passed (#421).
      # name-canonical=true is what lets the SBOM + provenance attestations
      # attach to the pushed index without a tag.
      - name: Build and push by digest (multi-arch, SBOM + provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=docker.io/ethosagent/warden,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max

  # The release gate (#369): the L2 suite runs against the pushed digest — the
  # only form in which this image exists on Docker Hub at this point.
  e2e:
    needs: [image]
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      image: docker.io/ethosagent/warden@${{ needs.image.outputs.digest }}
    # Named, not `inherit`: e2e.yml gets exactly the two it logs in with.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Tags and signs the exact digest e2e tested — the first job that makes the
  # image publicly usable. `image` is a direct need only for the digest
  # hand-off (the needs context carries direct dependencies); the gate it waits
  # on is e2e.
  publish:
    needs: [image, e2e]
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # keyless cosign signing (Sigstore via GitHub OIDC)
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # imagetools create re-tags the digest in place: both tags point at the
      # very digest e2e ran on. Nothing is rebuilt.
      - name: Tag the tested digest (v{version} + latest)
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "docker.io/ethosagent/warden:${version}" \
            --tag "docker.io/ethosagent/warden:latest" \
            "docker.io/ethosagent/warden@${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the tested digest (keyless)
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: cosign sign --yes "docker.io/ethosagent/warden@${DIGEST}"

  release:
    # Publish only once the tested digest is tagged and signed — and so only
    # after e2e passed on it. A red e2e leaves no GitHub Release.
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write      # create the release + upload assets
      id-token: write      # keyless cosign signing + provenance via OIDC
      attestations: write  # SLSA build-provenance attestations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history + tags for version stamping

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/warden-${os}-${arch}"
            echo "building ${out}"
            GOOS="${os}" GOARCH="${arch}" scripts/build.sh "${out}"
          done

      - name: Generate SBOM (syft → CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/warden-sbom.cyclonedx.json

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/warden-*'

      - name: Generate checksums
        working-directory: dist
        run: sha256sum warden-* > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign checksums (keyless)
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/warden-* dist/checksums.txt dist/checksums.txt.sig dist/checksums.txt.pem
