name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The same script developers run locally and the pre-push hook runs. This
      # is what guarantees CI parity — do NOT inline the individual steps.
      - name: Run check.sh
        run: scripts/check.sh --integration --json-out check-report.json

      # Upload on every run, pass or fail: the report is most useful when the
      # gate is red. Schema: docs/check-report.schema.json.
      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-report
          path: check-report.json
          if-no-files-found: warn
