name: Feature
description: Propose a change. Fill it so an agent or a person can build it without questions.
labels: ["type:feature"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem or goal, in 1-3 plain sentences.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What the change must do.
      placeholder: "- The proxy must ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements, one checkbox each. A test or scenario must be able to prove each one.
      placeholder: "- [ ] A request to X returns Y"
    validations:
      required: true
  - type: textarea
    id: touches
    attributes:
      label: Files likely touched
      description: Paths or directories. The pipeline predicts the risk tier from these.
      placeholder: "- internal/proxy/\n- docs/"
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Issues that must close first. An issue is ready for an agent only when all are closed.
      placeholder: "- #123"
    validations:
      required: false
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Agents take S or M. Split an L issue.
      options:
        - S
        - M
        - L
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this issue must not change.
    validations:
      required: false
