# golangci-lint configuration for Warden.
# A modern, security-tool-appropriate set: vet + staticcheck + the usual
# correctness/hygiene linters. Run via `make lint` or as part of scripts/check.sh.
version: "2"

linters:
  enable:
    - errcheck      # unchecked errors
    - govet         # go vet
    - ineffassign   # ineffectual assignments
    - misspell      # common misspellings
    - nolintlint    # every //nolint must name the linter and give a reason (#354)
    - staticcheck   # broad static analysis (subsumes gosimple/stylecheck)
    - unused        # unused code
  settings:
    nolintlint:
      # A //nolint must name the linter it silences and say why.
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      # Idiomatic unchecked-error patterns: fmt.Fprint*/Print*, *.Close, *.Flush,
      # os.Setenv/Remove, etc. — conventionally not error-checked.
      - std-error-handling
    rules:
      # Test fixtures legitimately ignore I/O errors (httptest handlers writing
      # responses, echo servers, raw conn read/write in the proxy tests).
      - path: _test\.go
        linters:
          - errcheck
      # x/net v0.60 deprecates http2.Transport, http2.ClientConn and
      # http2.Server.ServeConn in favour of net/http's native HTTP/2. They still
      # work; the gRPC pass-through keeps them until it moves to net/http.
      - path: internal/proxy/grpc(_test)?\.go
        linters:
          - staticcheck
        text: "SA1019"

formatters:
  enable:
    - gofmt

issues:
  max-same-issues: 0
