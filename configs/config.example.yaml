# Warden — example configuration
#
# This is the phase-1 (local) config shape. The same schema is reused when
# config later comes from a control-plane pull, so nothing here is throwaway.
#
# Core invariant: the allowlist is DEFAULT-DENY. Any destination not listed
# below is blocked. Secrets are referenced by placeholder only — the agent
# holds the placeholder, never the real value; the real value is injected at
# the proxy edge from the mapped environment variable.

# Listeners and proxy CA (all OPTIONAL). Precedence: CLI flag (--listen,
# --admin-listen, --ca-cert, --ca-key) > these keys > built-in default.
# With tls unset the proxy tunnels HTTPS blind (domain-only policy).
# listen: "127.0.0.1:8080"        # proxy listener (CONNECT + MITM)
# adminListen: "127.0.0.1:9090"   # dashboard/healthz/metrics/admin APIs
# admin:
#   tokenEnv: WARDEN_ADMIN_TOKEN  # env var holding the bearer token admin-dashboard WRITES need
#                                 # (--admin-token-env overrides). Unset = writes refused (403);
#                                 # reads stay open. See docs/control-plane.md.
# tls:
#   caCert: certs/proxy-ca.crt    # set caCert and caKey together
#   caKey: certs/proxy-ca.key

# Transparent interception mode (#376; OPTIONAL — default `forward`, which is
# the explicit CONNECT proxy above and byte-identical to pre-#376 behavior).
# In transparent mode the agent is NOT configured with a proxy: the network
# points its destinations at Warden (DNS or routing), Warden accepts raw dials
# on these listeners, reads the destination from TLS SNI (:443) or the Host
# header (:80), and runs the SAME pipeline — policy, swap, scans, audit, and
# the same deny reasons as CONNECT. See docs/transparent-interception.md for
# the deployment recipes (Docker/Kubernetes), CA distribution, and the
# UDP-443 (QUIC) / ECH requirements.
#
# proxy:
#   mode: forward                  # forward | transparent | both
#   transparent:
#     httpsListen: "0.0.0.0:443"   # raw TLS, SNI-gated (required in transparent/both)
#     httpListen: "0.0.0.0:80"     # plain HTTP, Host-gated (strictly opt-in; off unless set)
#
# Boot validation fails fast on: an unknown mode, transparent/both without
# httpsListen, or two listeners claiming one address (port 0 never clashes).
# Policy entries WITHOUT a `port` match both the 443 and 80 evaluations of a
# transparent request; port-pinned entries match only their port.

policy:
  # Default-deny allowlist. A destination is permitted only if it matches an
  # entry here. Port is optional: when omitted, Warden infers 443 (HTTPS) or
  # 80 (HTTP) from the request scheme.
  #
  # Entries can be narrowed to specific methods and paths (`methods` / `paths`,
  # both optional). Matching is ANY-match-wins across entries: a request is
  # allowed when ANY entry for the destination admits it — so an unconstrained
  # entry for the same domain makes a constrained twin useless. A rule's
  # rateLimit counts only requests that matched that rule's own constraints.
  #
  # BEHAVIOUR CHANGE (#371): a rateLimit used to be consumed once per CONNECT
  # tunnel; it is now consumed PER REQUEST. For a rule without methods/paths, N
  # keep-alive requests over one tunnel count N, not 1 — tighten the limit (or
  # add constraints, which keep denied requests free) when migrating.
  #
  # `methods` lists uppercased HTTP methods; the match is case-sensitive against
  # the method exactly as sent — method-override headers such as
  # X-HTTP-Method-Override are NOT checked. `paths` patterns are matched against
  # the RAW (percent-encoded) request path — no decoding on either side:
  #   /v1/chat      exact path
  #   /acme/app/*   the path itself and everything under it (segment-aligned)
  #   /acme/*/x     * matches within one path segment
  #   /*            any path
  # When an entry constrains paths, a request whose raw path contains a dot
  # segment, a matrix parameter, or an encoded separator (/../, /./, %2e, %2f,
  # %5c, %3b, raw or encoded ";", backslash, //) is DENIED (path_not_canonical)
  # even if it string-matches a pattern — the bytes matched and the resource the
  # origin serves must be the same thing. (Java servers strip ";params" per
  # segment, so /v1/..;/admin would be /admin upstream.)
  #
  # Residual risk: decodings Warden cannot see still apply origin-side.
  # Double-encoding (%252e), overlong UTF-8 (%c0%ae), and %00 reach the origin
  # verbatim when a pattern allows them — scope patterns tightly.
  allowlist:
    - domain: api.openai.com            # port omitted -> inferred 443 (HTTPS)
    - domain: api.anthropic.com
    - domain: "*.internal.company.com"  # wildcard matches subdomains (not the apex)
      port: 8443                        # explicit port overrides inference
      rateLimit: "100/hour"             # per-rule rate limit
      timeWindow: "9-17"               # allowed hours (local time)
    - domain: github.com                # narrowed: reads anywhere, writes only
      methods: ["GET", "HEAD"]          # under the two allowed prefixes
    - domain: github.com
      methods: ["POST", "PATCH", "PUT", "DELETE"]
      paths: ["/acme/app/*", "/acme/app.git/*"]
    # Identity scope (NOT YET ENFORCED: a config that sets groups/users is
    # rejected at load until the evaluator supports it):
    # - domain: github.com
    #   groups: ["eng", "sre"]              # IdP groups (exact, case-sensitive)
    #   users: ["alice@corp.example", "u-123"]  # email (lowercased) or exact sub
  denylist:
    - domain: evil.example.com
    - domain: "*.malware.net"

# Placeholder -> environment variable mapping for the phase-1 ENV secret
# provider. The agent only ever holds the placeholder (e.g. openai_secret_001);
# Warden swaps it for the real value of OPENAI_API_KEY at the edge.
#
# `matchHosts` scopes a placeholder to its intended destinations (policy syntax:
# exact host, "*.suffix", or "~regex"). The placeholder is swapped ONLY on
# requests whose destination host (the CONNECT/SNI host) matches; elsewhere it is
# forwarded untouched and an out-of-scope event is recorded. NOTE: "~regex" is an
# UNANCHORED (substring) match, like the policy engine: "~github\.com" also
# matches "evil-github.com". Anchor it ("~^api\.github\.com$") or use an exact
# host / "*.suffix".
# An entry WITHOUT
# matchHosts is swapped on every allowed host (legacy behavior) and logs a
# startup warning; matchHosts is expected to become required in a future release.
secrets:
  - placeholder: openai_secret_001
    envVar: OPENAI_API_KEY
    matchHosts: ["api.openai.com"]
  - placeholder: anthropic_secret_001
    envVar: ANTHROPIC_API_KEY
    matchHosts: ["api.anthropic.com"]

# Secret backend selector (OPTIONAL). Omit this block for the default `env`
# behavior above — that is byte-identical to today. `secretStore` is a sibling
# of `secrets` (the placeholder set above stays a list); it only chooses HOW a
# placeholder resolves to a value.
#
# secretStore:
#   backend: env        # env | echo | aws  (default: env when omitted)
#
#   # backend: env  — resolve each placeholder from its mapped envVar above.
#   #                 envVar is REQUIRED for every secrets[] entry.
#
#   # backend: echo — NON-PRODUCTION. The resolved "value" is the placeholder
#   #                 KEY itself (e.g. openai_secret_001 -> "openai_secret_001").
#   #                 It proves the resolve->swap wiring with zero cloud deps and
#   #                 powers local dev/demos. envVar is optional/ignored here.
#   #                 NEVER use echo to protect a real secret value.
#
#   # backend: aws  — AWS Secrets Manager. Parsed + validated now; the store
#   #                 itself lands in Phase 5. Credentials are NEVER in config —
#   #                 they resolve from the process environment / IAM.
#   aws:
#     region: us-east-1
#     namePrefix: warden/   # key -> secret name convention: warden/<key>
#                           # (default warden/ when omitted)

# In-memory secret cache. Never persisted to disk.
cache:
  ttl: 3600                             # seconds; on expiry Warden refreshes
                                        # silently and keeps the stale value if
                                        # a silent refresh fails.

# Observability output. Logs reference secrets by hash/last-4/version only and
# never contain full request/response bodies.
logging:
  level: info                           # debug | info | warn | error
  format: json                          # json | text

# OpenTelemetry observability (Phase 1: metrics + structured logging). OFF by
# default; when disabled there is zero behavior change and no added latency.
# Metric labels are bounded enums/configured names only — never a raw domain,
# never a secret value, never a body. Traces (Phase 2) and collector recipes
# (Phase 3) are deferred. Standard OTEL_* env vars override this block:
# OTEL_SERVICE_NAME -> serviceName, OTEL_EXPORTER_OTLP_ENDPOINT -> otlpEndpoint.
observability:
  enabled: false                        # master switch for the OTel emission seam
  serviceName: warden                   # OTel resource service.name
  metrics:
    enabled: true                       # serve Prometheus /metrics on the ADMIN listener (not the proxy port)
    otlpEndpoint: ""                    # optional OTLP/grpc push, e.g. otel-collector:4317
  resourceAttributes: {}                # extra bounded resource attrs (e.g. warden.proxy.id); never secrets

# Optional inline LLM judge. OFF by default. The judge is NEVER authoritative:
# static allow/deny rules always win, and it is consulted ONLY for requests that
# match neither list (a "no-match"). It fails closed (deny) on any error and
# never sees secret values — only auth presence. Static rules are untouched.
judge:
  enabled: false                        # inline judge off by default
  provider: openai                      # OpenAI-compatible chat-completions API
  model: gpt-4o-mini
  baseURL: https://api.openai.com/v1
  apiKeyEnv: OPENAI_API_KEY             # env var holding the API key (never logged)
  timeout: 5s                           # hard per-call timeout
  circuitBreaker:
    maxFailures: 5                      # trip after N consecutive failures
    cooldown: 30s                       # deny-all window while tripped
  cache:
    ttl: 5m                             # verdict cache TTL
  rateLimit: 100/minute                 # cap on judge invocations

# Per-agent natural-language policies, interpreted by the inline judge. With one
# proxy per agent, the single agent id below is used for judge lookups.
agents:
  - id: default
    policy: |
      This agent may read from approved APIs. It must NOT post to social media,
      access internal admin endpoints, or make requests outside business hours.

# Offline advisory mode (CLI: `warden advise`). OFF by default. It only flags
# recommendations to humans and can never alter policy. Hard deterministic
# auto-rules are configured independently of the LLM (not yet implemented).
advisory:
  enabled: false

# MCP egress wedge. OFF by default: when mcp.enabled is false there is zero new
# code on the hot path and byte-identical behavior to a Warden without it. When
# enabled, live MCP-over-HTTP traffic (already decrypted by TLS termination) is
# routed through the deep MCP analyzers — tool policy, schema-drift, poisoning,
# call-chain, and content scan. Three modes:
#   off      - no MCP processing.
#   monitor  - detect + analyze + log + metric, NEVER block (the adoption wedge).
#   enforce  - monitor PLUS block (deny non-allowlisted tools, high-severity
#              findings, pinned-schema drift).
# In enforce mode WebSocket and SSE MCP traffic is HELD until scanned: each WS data
# message (text OR binary, all fragments of it) / SSE event is forwarded only after
# the scan allows it, so a denied message never reaches its peer. A binary WS
# message is scanned as UTF-8 JSON-RPC; one that is not valid UTF-8 JSON cannot be
# scanned and is denied (the connection is torn down). A continuation with no open
# message, or a new data message inside an open one, is denied too. The added
# latency is one message. Worst-case memory is ONE buffered message per direction
# per WS connection (8 MiB cap, so up to 16 MiB per connection) and 1 MiB per SSE
# stream; a message/event over the cap is denied rather than forwarded unscanned.
# WS control frames (ping/pong/close) are never held. If the gateway does not report
# its mode, Warden fails safe and holds. Monitor mode forwards first and scans after
# (lowest latency, nothing blocked, binary frames not scanned).
# MCP analysis only ever makes a decision MORE restrictive; it never re-allows a
# request the domain/port default-deny already blocked. Never persists tool
# arguments, results, or matched content — only bounded enums and counts.
mcp:
  enabled: false                  # master switch (default false)
  mode: monitor                   # off | monitor | enforce (default monitor when enabled)
  failClosedOnError: false        # analysis error -> deny? default false (fail-open)
  maxResponseScanBytes: 1048576   # cap on buffered response scanning (1 MiB)
  tools:                          # default-deny tool policy (deny wins over allow)
    allow: []                     # permitted tool names; empty + enforce = deny all tools/call
    deny: []                      # blocked tool names; wins over allow
    rateLimit: {}                 # tool name -> "N/second|minute|hour"
    constraints: {}               # per-tool argument constraints (checked after allow/deny);
                                  # values are inspected transiently, never stored. Example:
                                  #   read_file:
                                  #     maxArgsBytes: 65536            # cap on raw arguments size (0 = unlimited)
                                  #     fields:
                                  #       path:      { match: "^/workspace/.*", maxLen: 4096, required: true }
                                  #       recursive: { forbidden: true }
                                  #   deploy:
                                  #     allowWhen:                     # further gate an ALLOWED tool (never re-allows)
                                  #       agentId: "ci-agent"          # permit only for this agent id
                                  #       timeWindow: "09-17"          # permit only within HH-HH (server local, 0-23)
                                  #       groups: ["eng"]              # NOT YET ENFORCED: rejected at load for now
                                  #       users: ["alice@corp.example"]  # NOT YET ENFORCED: rejected at load for now
  schema:
    pin: false                    # block on any tools/list drift (enforce mode)
  scan:
    toolArgs: true                # scan outbound tool arguments
    toolResults: true             # scan inbound tool results
    profileSchema: true           # learn + merge observed in/out schema per tool
    evidence: false               # opt-in: keep a MASKED sample per finding (•••• + last-4 + length,
                                  #         NEVER the raw value) so you can tell a real leak from a
                                  #         false positive in the dashboard. Local config (not distributed).
    pii:
      phone: false                # email/card(Luhn)/SSN always on; phone opt-in (noisy)
  chain:
    enabled: true                 # per-session call-chain analysis
    windowSize: 50                # sliding-window size (must be > 0)
    patterns: [read_then_send, permission_probing, rapid_repeat]
  scopes: {}                      # task-scoped authorization: approve a PURPOSE once, then the
                                  # gateway holds the agent to that purpose's tool-set on every
                                  # call. Scopes only NARROW the tools.allow policy (a tool must be
                                  # base-allowed first) and never re-permit a denied/restricted tool.
                                  # Absent = no scoping. LOCAL config. Example:
                                  #   activeScope: triage-readonly   # global active scope id
                                  #   outOfScope: deny               # deny (default) | escalate
                                  #   perAgent:                      # optional per-agent override
                                  #     reporting-bot: triage-readonly
                                  #   list:
                                  #     - id: triage-readonly
                                  #       purpose: "Read-only triage; never send."
                                  #       tools: [get_customer, read_ticket]   # in-scope tool-set
                                  #       constraints:                          # reuses tools.constraints shape
                                  #         get_customer:
                                  #           fields: { id: { match: "^[0-9]+$", required: true } }
                                  # An out-of-scope call is denied+logged (mcp_out_of_scope) in enforce;
                                  # monitor logs without blocking. outOfScope: escalate is DEFERRED —
                                  # with no approval channel it degrades to deny (never widens access).
  servers: []                     # per-server binary-integrity pinning for the `warden mcp` wedge.
                                  # Select an entry at launch with `--server <name>`; the wedge then
                                  # verifies the resolved server binary before starting and REFUSES to
                                  # launch on any mismatch (fail-closed). All fields are hex. sha256 and
                                  # the ed25519 signature compose: when both are set, both must pass.
                                  # CLI flags (--verify-sha256, --verify-ed25519-pubkey,
                                  # --verify-ed25519-sig) override the matching config field. LOCAL config.
                                  # Example:
                                  #   - name: github-mcp              # matched by `warden mcp --server github-mcp`
                                  #     sha256: 3b1f...                # expected SHA-256 of the binary (hex)
                                  #     ed25519PublicKey: 9a0c...      # 32-byte signing public key (hex)
                                  #     ed25519Signature: 4d2e...      # 64-byte detached signature over the binary (hex)
                                  # A signature requires a public key; a signature without one is rejected.

# Response scanning for ORDINARY (non-MCP) HTTP/HTTPS responses. OFF by default:
# when responseScan.enabled is false there is zero new work on the hot path and
# byte-identical behavior. When enabled, Warden buffers each non-MCP response body
# (up to maxBodyBytes) and runs the SAME detectors the MCP wedge uses — credential
# leakage, prompt injection, and PII. MCP responses are scanned by the mcp block
# above and are never double-scanned here. Modes:
#   off      - no response scanning.
#   monitor  - detect + log (masked evidence only) + metric, NEVER block.
#   enforce  - monitor PLUS replace a flagged response body with a 502 error.
# Streaming responses (text/event-stream), chunked/unknown-length bodies, and any
# body larger than maxBodyBytes are forwarded UNCHANGED and logged as skipped —
# never buffered unbounded, never silently truncated. Scan analysis is fail-open:
# a scanner error logs and forwards (it never breaks egress). Never logs full
# bodies or raw secrets — masked evidence + bounded finding kinds only.
responseScan:
  enabled: false                  # master switch (default false)
  mode: monitor                   # off | monitor | enforce (default monitor when enabled)
  maxBodyBytes: 1048576           # cap on buffered response scanning (1 MiB); over-cap/streaming = skipped+logged
  evidence: false                 # opt-in: keep a MASKED sample per finding (never the raw value)
  pii:
    phone: false                  # email/card(Luhn)/SSN always on; phone opt-in (noisy)

# Echo guard: stops an upstream that copies the request into its response (an echo
# endpoint, an error quoting the request, a reflected header) from handing the agent
# the real secret Warden swapped in. It checks every response of a request for the
# EXACT values swapped into THAT request (placeholders, Basic auth, auth
# transformers) in raw, base64, URL-encoded, hex and JSON-escaped form — headers and
# body, h1/h2/gRPC/SSE. ON by default and independent of responseScan; a request
# that swapped nothing is not touched. Swapped requests ask the upstream for
# `Accept-Encoding: identity`; gzip/deflate answers are decompressed for the check,
# any other encoding, a compressed body of unknown length, or a compressed body over
# the scan cap (responseScan.maxBodyBytes, else 1 MiB), is blocked as
# secret_echo_unscannable. An uncompressed body is streamed through the check at
# any size, so large downloads still work; the cap only bounds what is buffered.
# Action:
#   block    - (default) buffered response -> 502; streaming response -> the stream
#              is aborted before any byte of the value is released. To guarantee
#              that, a streamed response is delayed by up to the longest encoded
#              value (tens to ~100 bytes): the last bytes are released with the
#              next chunk or at the end of the stream. A stream that ends on the
#              start of a value (4+ bytes) is aborted, not delivered.
#   monitor  - record a hit (allow event, reason secret_echo) and forward anyway.
# It targets HONEST reflectors, not an upstream trying to smuggle the value out. It
# does NOT catch: base32, base64 wrapped across lines, HTML entities,
# quoted-printable, reversed or split values, \u escapes of non-ASCII characters in
# the value, or gzip/deflate bytes sent without a Content-Encoding header.
# WebSocket frames after a 101 upgrade are checked too when the upgrade request
# swapped a value (#399): the server->agent data frames (text/binary/
# continuation) are matched as one ordered stream across frames and messages for
# the whole connection, and ping/pong/close payloads are each checked on their
# own. Like a streamed body, the check trades liveness for exactness: a frame
# that ends inside the start of a value (4+ bytes) is held until the NEXT frame
# proves it clear, and if the connection closes first the held frame is dropped,
# not delivered. A swapped upgrade does not offer permessage-deflate, and a
# compressed (RSV) frame that arrives anyway is refused (1008,
# secret_echo_unscannable).
echoGuard:
  enabled: true                   # default true; false disables the guard entirely
  action: block                   # block | monitor

# Per-destination request-authentication transforms. The agent sends a request
# with a placeholder or no auth at all; Warden injects real, request-scoped
# credentials at the edge. Credentials are read from the environment via ${VAR}
# and held by the proxy only — never seen by the agent, never logged.
# `match` (required) scopes the entry to destination hosts and uses the policy
# syntax: exact host, "*.suffix", or "~regex"; the credential is injected only on
# requests to a matching host.
# Types: oauth2_client_credentials | aws_sigv4 | hmac | api_key.
auth: []
  # - match: api.salesforce.com
  #   type: oauth2_client_credentials
  #   tokenURL: https://login.salesforce.com/services/oauth2/token
  #   clientID: ${SALESFORCE_CLIENT_ID}
  #   clientSecret: ${SALESFORCE_CLIENT_SECRET}
  #   scopes: [api]
  # - match: "~\\.amazonaws\\.com$"
  #   type: aws_sigv4
  #   region: us-east-1
  #   service: bedrock                 # optional; many APIs need it explicit
  #   accessKeyID: ${AWS_ACCESS_KEY_ID}
  #   secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
  #   sessionToken: ${AWS_SESSION_TOKEN}   # optional (assumed roles / IRSA)
  # - match: api.stripe.com
  #   type: hmac
  #   algorithm: sha256                # sha256 | sha512 | sha1
  #   secret: ${STRIPE_WEBHOOK_SECRET}
  #   header: Stripe-Signature
  # - match: api.sendgrid.com
  #   type: api_key
  #   location: header                 # header | basic_auth
  #   name: Authorization
  #   value: "Bearer ${SENDGRID_API_KEY}"

# Control plane (remote policy). When endpoint is set, Warden pulls its
# allow/deny policy from the control plane at startup and re-pulls every
# pollInterval, hot-swapping the live evaluator with NO restart. A failed pull
# keeps the last-known-good policy, so a worker survives a control-plane outage.
# Secrets/judge/observability stay from this local file.
controlPlane:
  endpoint: ""                    # https URL of the policy endpoint ("" disables)
  tokenEnv: ""                    # env var holding the bearer token
  caCert: ""                      # CA (PEM) to trust the CP's cert, per-connection only
  longPollWait: 30s               # how long the CP holds /policy open before 304
  heartbeatInterval: 10s          # liveness ping cadence
  localOnly: false                # true = ignore the CP, enforce local policy (standalone)
  # When endpoint is set and localOnly is false, the worker is CP-MANAGED: policy
  # comes only from the control plane and the worker boots fail-closed (deny all)
  # until its first pull. Secrets always stay local.

# Fleet analytics aggregation.
#   off        - single node (default).
#   aggregator - host POST /central/ingest on the admin listener; the dashboard
#                shows the fleet-wide central store instead of this node's db.
#   worker     - forward this proxy's local events to a remote aggregator.
central:
  mode: off                       # off | aggregator | worker
  tokenEnv: ""                    # bearer token env (ingest auth, both sides)
  maxEvents: 0                    # aggregator: central retention cap (0 = default)
  endpoint: ""                    # worker: aggregator ingest URL
  proxyID: ""                     # worker: label this proxy's events
  batchSize: 100                  # worker: events per forward batch
  bufferCap: 10000                # worker: local buffer cap before dropping oldest
  interval: 10s                   # worker: forward cadence
  mcpPushInterval: 30s            # worker: how often to forward the MCP inventory + schema
                                  #   (push-on-change is automatic; needs mcp.enabled)
  forwardSecretInventory: false   # worker: forward configured secrets BY REFERENCE
                                  #   (sha256/last4/length, NEVER values) to the CP

# Audit features. Signed receipts emit an Ed25519-signed, independently
# verifiable record per mediated event (tamper-evident evidence). Compliance
# tags each event with OWASP/MITRE control IDs for governance reporting.
audit:
  signedReceipts:
    enabled: false                # off by default
    keyFile: ""                   # Ed25519 PKCS#8 PEM; generated+persisted if absent
    log: ""                       # JSONL receipts path (required when enabled)
  compliance:
    enabled: false                # tag events with OWASP/MITRE control IDs
  # JSON decision stream (warden.decision.v1): one JSON line per stored event for a
  # SIEM shipper. Node-local, restart-only. Off when the block is absent. The
  # option set is validated at startup; the writer ships in a later release.
  jsonLog:
    enabled: false                # off by default
    output: stdout                # stdout | stderr | file
    path: ""                      # required when output is file
    maxSizeMB: 100                # rotate the file at this size
    maxBackups: 10                # rotated files kept (0 = no count limit)
    maxAgeDays: 30                # days a rotated file is kept (0 = no age limit)
    compress: false               # gzip rotated files
    fileMode: 0600                # 0600 or 0640
    query: drop                   # drop = no query data; keys = parameter names only

# Outbound alert integrations (control-plane-only; NEVER served to workers).
# Security-relevant findings are deduped into Alerts, persisted to the alert
# store (always on, system-of-record), then PUSHED to the integrations whose
# `match` predicate selects them. Routing is default-deny: an omitted or empty
# `match` means match-NONE, so a sink receives nothing until it opts in.
#   match: AND across a clause's keys, OR across the list. Keys are
#          {severity, category, domain, rule}.
#   Secrets (webhook URLs, tokens) are referenced via ${ENV}, never inline.
# integrations:
#   - type: webhook                 # registered sink type
#     name: sec-alerts              # instance name (unique)
#     config:
#       url: "${WARDEN_WEBHOOK_URL}" # resolved from the env at Start; never logged
#     match:
#       - severity: high            # any high-severity alert, OR…
#       - category: security        # …any security-category alert

# Upstream DNS resolver for WARDEN'S OWN lookups (OPTIONAL; omitted = Go's
# default resolver, byte-identical behavior). When set, the proxy's upstream
# dials — CONNECT tunnels and TLS-terminated upstreams — resolve names through
# this "<host>:<port>" server instead of the resolver the container inherits.
#
# Use it where the default resolver cannot resolve public allowlisted names:
# corporate networks / VPNs that block or filter public DNS, split-horizon
# environments, or container runtimes whose embedded DNS forwards to a resolver
# that refuses external names.
#
# Transport is plain UDP (TCP only for the DNS truncation fallback); DoH/DoT
# resolver transports are out of scope for v1 — please don't file that as a bug.
#
# Scope: this governs WARDEN'S OWN upstream dials only. It does not touch the
# dashboard/admin listeners, and it is NOT the agent's DNS path — under the
# transparent-interception contract (#376) agent-side names are routed to
# warden by the orchestration runtime. TLS/SNI is unaffected: the
# client-supplied hostname is kept; only the dial target's resolution changes.
#
# Failure semantics: if this server is unreachable, lookups fail and each
# affected request fails exactly like an upstream-connect failure today
# (visible in analytics + the dashboard blocked/fail lists). There is NO silent
# fallback to the system resolver — that would mask the misconfiguration.
# Warden logs one line at startup and again on the first failed lookup.
#
# dns:
#   upstreamResolver: "10.20.30.2:53"   # <host>:<port>; omit -> default resolver

# SSRF EXCEPTIONS for warden's own upstream dials (lab and test networks only;
# never set this in production).
#
# allowPrivateCIDRs lists CIDR ranges exempted from the SafeDialer's
# private-IP blocklist, for networks where an allowlisted upstream legitimately
# sits on a private range — the container test harness (deploy/compose/
# docker-compose.e2e.yml) dials its fake upstream across a Docker bridge, for
# example. Every entry must be a narrow CIDR (at least /8 for IPv4, /16 for
# IPv6) and may never overlap loopback (127.0.0.0/8, ::1), link-local / cloud
# metadata (169.254.0.0/16, fe80::/10), or the unspecified ranges; anything
# else fails at startup. With the key set, warden logs one WARN listing the
# active exceptions — treat that line as the smell it is.
#
# This key is LOCAL wiring: it is never served by a control plane to a worker,
# and a managed worker ignores any attempt to push it.
#
# upstream:
#   allowPrivateCIDRs:
#     - "10.200.0.0/24"   # e.g. the e2e stack's egress subnet

# Identity verification (OFF when this block is absent: no token is read or
# verified and behavior is byte-identical to before). Attribute mode verifies a
# user token and records who made the request; it never blocks. The block holds
# no secrets. Phase 1 modes: off | attribute ("require" arrives in Phase 2).
# Per-agent override: `identity: off|attribute` on an agents[] entry.
#identity:
#  defaultMode: attribute                  # off | attribute (default off)
#  issuer: http://localhost:5556/dex       # dev only: plain http needs internalIssuerURL
#  internalIssuerURL: http://dex:5556      # dev-only split-horizon: origin containers use to reach the issuer
#  audience: warden
#  allowedAZP: [agent-harness, warden-cli] # empty = no azp check
#  groupsClaim: groups
#  clockSkewSeconds: 60                    # 0..300 (0 = default 60)
#  maxTokenTTLSeconds: 3600                # >0 overrides the default 3600

# Production form: an
# https issuer and no internalIssuerURL. The block holds no secrets.
#identity:
#  defaultMode: attribute                  # off | attribute (default off)
#  issuer: https://idp.example.com
#  audience: warden
#  allowedAZP: [agent-harness, warden-cli] # empty = no azp check
#  groupsClaim: groups
