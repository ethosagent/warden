# Warden control-plane config for the L2 IDENTITY stack (deploy/compose/
# docker-compose.e2e-identity.yml): a copy of config.e2e-cp.yaml plus the
# console block below (W-P1-SSO-07), which puts the console in oidc mode
# against the stack's Dex, and an echo secretStore that mounts /central/secrets.
# Keep the two files otherwise in step.
#
# Original header, for the HERMETIC e2e stack (deploy/compose/
# docker-compose.e2e.yml). The e2e workers are CP-MANAGED
# (configs/config.e2e-worker.yaml), so THIS is the live allow/deny policy both
# of them pull, hot-reload on change, and enforce — the deny path
# (evil.example.test) and the allow path (api/llm/mcp.example.test) are proven
# against it. evil.example.test is denied explicitly even though default-deny
# would already block it: the scenarios assert the DENY path, and a denylist
# entry holds even if the allowlist is later widened.
#
# The control plane never holds secrets — nothing canary-related belongs here,
# and nothing here can set a worker's local wiring (secrets, DNS, the SSRF
# exception): those keys do not exist on the CP→worker wire.

policy:
  allowlist:
    - domain: api.example.test
    - domain: llm.example.test
    - domain: mcp.example.test
    # self.example.test exists ONLY for the transparent loop-guard test (#376):
    # worker-3's own t-net address is allowlisted so the request passes the
    # SNI/Host gate and reaches the upstream dial — which the loop guard must
    # then refuse. Without the guard this allowlist entry is what makes the
    # interception loop possible, so the drill is honest. On the egress network
    # the name is NXDOMAIN, so workers 1/2 can never reach anything with it.
    - domain: self.example.test
  denylist:
    - domain: evil.example.test

logging:
  level: info
  format: json

# NON-PRODUCTION echo store (it persists nothing): only so the CP mounts
# /central/secrets on this stack (W-P1-SSO-07). Without a writable store the
# route is absent (404) and the console SSO test could not prove the shared
# bearer is refused there (401) while an admin session is let in.
secretStore:
  backend: echo

# Console sign-in against the stack's Dex (W-P1-SSO-07, test/e2e/identity/
# console_sso_test.go). Split horizon: the browser (the host) reaches Dex at the
# public issuer http://localhost:5556/dex; inside the CP container localhost is
# the CP itself, so the CP reaches Dex as http://dex:5556 (internalIssuerURL).
# The secret is the env var NAME; its dev value comes from deploy/compose/dex/
# .env.example via docker-compose.e2e-identity.yml. Roles map the seeded LDAP
# groups (deploy/compose/dex/seed.ldif): alice admin, bob editor, carol viewer,
# dave (eng only) no role. With this block every /dashboard/* read needs a
# session, so the package helpers read the CP as a signed-in user.
console:
  auth: oidc
  oidc:
    issuer: http://localhost:5556/dex
    internalIssuerURL: http://dex:5556
    clientID: warden-console
    clientSecretEnv: WARDEN_CONSOLE_DEX_CLIENT_SECRET
    redirectURL: https://localhost:7070/auth/callback
  roles:
    admin: [warden-admins]
    editor: [warden-editors]
    viewer: [warden-viewers]

# Group-gated MCP tool (W-P1-GPOL-14, test/e2e/identity/group_policy_test.go):
# the worker pulls this block as CP settings and enforces it. The poisoned MCP
# server at mcp.example.test answers any tools/call, so "deploy" needs no
# server-side tool: allowWhen.groups limits it to eng (alice and dave).
# list_files is ungated. Nothing else in this stack calls MCP tools.
mcp:
  enabled: true
  mode: enforce
  tools:
    allow: [list_files, deploy]
    constraints:
      deploy:
        allowWhen:
          groups: [eng]

# The identity block rides the control-plane settings to every managed worker,
# and a settings apply (any dashboard policy save) replaces the worker's local
# block with this one: without it a policy edit would switch identity off and
# every scoped destination would be denied (identity_required). Keep it equal to
# the worker copy's (configs/config.e2e-identity-worker.yaml); W-P1-GPOL-14.
identity:
  defaultMode: attribute
  issuer: http://localhost:5556/dex
  internalIssuerURL: http://dex:5556
  audience: warden
  allowedAZP: [agent-harness, warden-cli]
