# Warden control-plane policy.
#
# This is the policy every data-plane worker pulls and enforces. It is
# ALLOW/DENY ONLY: the control plane never holds or serves secrets — those stay
# on each worker. Edit this file and workers pick up the change on their next
# poll (no restart). The control plane re-reads it on each request.

policy:
  allowlist:
    - domain: api.github.com
    - domain: "~.*\\.githubusercontent\\.com$"
  denylist:
    - domain: evil.example.com

logging:
  level: info
  format: json

# Identity verification (OFF when this block is absent: no token is read or
# verified and behavior is byte-identical to before). Attribute mode verifies a
# user token and records who made the request; it never blocks. The block holds
# no secrets. Phase 1 modes: off | attribute ("require" arrives in Phase 2).
# Per-agent override: `identity: off|attribute` on an agents[] entry.
#identity:
#  defaultMode: attribute                  # off | attribute (default off)
#  issuer: http://localhost:5556/dex       # dev only: plain http needs internalIssuerURL
#  internalIssuerURL: http://dex:5556      # dev-only split-horizon: origin containers use to reach the issuer
#  audience: warden
#  allowedAZP: [agent-harness, warden-cli] # empty = no azp check
#  groupsClaim: groups
#  clockSkewSeconds: 60                    # 0..300 (0 = default 60)
#  maxTokenTTLSeconds: 3600                # >0 overrides the default 3600

# Production form: an
# https issuer and no internalIssuerURL. The block holds no secrets.
#identity:
#  defaultMode: attribute                  # off | attribute (default off)
#  issuer: https://idp.example.com
#  audience: warden
#  allowedAZP: [agent-harness, warden-cli] # empty = no azp check
#  groupsClaim: groups

# Console sign-in (CP-LOCAL; read from this --config file only, never served to
# workers, and edits to the --state-dir copy are ignored). Absent block means
# `auth: none`: today's behaviour (open reads, dashboard writes gated by the admin
# bearer), with a startup warning; --require-console-auth refuses to start in it.
# `auth: oidc` needs --state-dir and the client-secret env var; every human route
# (/dashboard/*, /central/secrets) then needs a session and the shared bearer
# opens none of them. The block holds the env var NAME, never the secret.
# Defaults: clientID warden-console, scopes [openid, email, profile, groups],
# session idle 1h / absolute 12h (0 < idle <= absolute <= 168h). Group matching
# is exact and case-sensitive; the highest matching role wins. Changing this
# block needs a control-plane restart.
#
# Production form (https issuer):
#console:
#  auth: oidc                              # none | oidc (default none)
#  oidc:
#    issuer: https://idp.example.com
#    clientID: warden-console
#    clientSecretEnv: WARDEN_CONSOLE_CLIENT_SECRET
#    redirectURL: https://warden.example.com/auth/callback  # must end in /auth/callback
#  roles:
#    admin: [warden-admins]                # at least one admin group
#    editor: [warden-editors]
#    viewer: [warden-viewers]
#  session:
#    idle: 1h
#    absolute: 12h
#  adminAudit:
#    enabled: false                        # signed admin audit log (default false); needs --state-dir.
#                                          # Key: --admin-audit-key-file (default <state-dir>/cp-audit.key).
#  trustedProxies: []                      # CIDRs of reverse proxies whose X-Forwarded-For sets the
#                                          # admin audit client_ip (default none: the peer address).
#  breakGlass:                             # emergency local admin login for when the IdP is down;
#                                          # off by default; needs auth: oidc. Make the hash with
#                                          # `warden control-plane hash-password` (argon2id).
#    enabled: false
#    username: breakglass-admin            # placeholder; at most 128 bytes
#    passwordHashEnv: WARDEN_BREAKGLASS_HASH  # env var NAME holding the hash; or passwordHashFile
#                                          # (exactly one; a file is re-read so it can rotate)
#    sessionTTL: 1h                        # default 1h, max 4h
#    allowBehindTLSTerminator: false
#  approvals:                             # change approvals (W-P2-APPR-01). NOT available yet: this
#                                          # build refuses enabled: true at startup. Off by default.
#    enabled: false                        # will need auth: oidc, --policy-store=versioned,
#                                          # --state-dir and adminAudit.enabled: true
#    minApprovals: 1                       # 1..3
#    allowSelfApproveNarrowing: true
#    allowEmergencyApply: false
#    replayWindow: 168h                    # 1h..720h
#    replayMaxEvents: 100000               # 1..100000
#    replayTimeout: 60s
#    replayMaxAge: 24h
#    draftTTL: 168h
#    maxOpenDrafts: 200
#  apiKeys:                                # scoped wak_ API keys on /dashboard/api/*; off by default;
#                                          # needs auth: oidc and --state-dir (docs/control-plane.md)
#    enabled: false
#    defaultTTL: 2160h                     # default key lifetime; at most maxTTL
#    maxTTL: 8760h                         # also the hard ceiling
#    maxPerOwner: 25                       # active keys per owner
#    ratePerKey: 10                        # requests per second per key (burst 2x)
#
# Compose dev profile (Dex): the CP runs in a container where `localhost` is
# itself, so the browser-facing issuer stays public and internalIssuerURL names
# the origin the CP reaches the IdP on. Matches the warden-console Dex client.
#console:
#  auth: oidc
#  oidc:
#    issuer: http://localhost:5556/dex
#    internalIssuerURL: http://dex:5556
#    clientID: warden-console
#    clientSecretEnv: WARDEN_CONSOLE_DEX_CLIENT_SECRET
#    redirectURL: https://localhost:7070/auth/callback
#  roles:
#    admin: [warden-admins]

# Consent portal sign-in (CP-LOCAL, like console: read from this --config file only,
# never served to workers). Absent block or enabled: false means no /portal route and
# nothing changes. Enabling it needs console.auth oidc, --state-dir, the client-secret
# env var, and consent.oidc.issuer equal to identity.issuer. Scopes are fixed (openid
# email profile groups, plus offline_access while idpLink is enabled). allowedGroups
# empty means any user of the issuer. Session defaults are shorter than the console's
# (a portal session can approve third-party access for agents). Matches the
# warden-portal Dex client. Changing this block needs a control-plane restart.
#consent:
#  enabled: true
#  oidc:
#    issuer: http://localhost:5556/dex      # must equal identity.issuer
#    internalIssuerURL: http://dex:5556
#    clientID: warden-portal
#    clientSecretEnv: WARDEN_PORTAL_DEX_CLIENT_SECRET
#    redirectURL: https://localhost:7070/portal/callback  # path exactly /portal/callback
#  allowedGroups: []
#  session:
#    idle: 30m                              # 0 < idle <= absolute <= 24h
#    absolute: 8h
#  idpLink:
#    enabled: true                          # request offline_access, keep the refresh token
#    refreshLifetime: 720h                  # Dex expiry.refreshTokens.absoluteLifetime
#  # CP-only user credential store (docs/control-plane.md "CP-only user credential
#  # store"). No worker ever gets a credential for it; its namePrefix must not overlap
#  # secretStore.aws.namePrefix. Credentials come from the CP environment or role only.
#  # Required (and must be persistent, not echo) while idpLink.enabled is true.
#  store:
#    backend: aws                           # aws | vault (not yet) | echo (--dev only)
#    namePrefix: warden-cp/
#    aws:
#      region: us-east-1
#  # OAuth providers the broker connects employees to (needs the store above; the broker
#  # is not mounted yet). Exactly one of clientSecretEnv or clientSecretKey
#  # (oauth-clients/<id> in consent.store). Secrets are read once: rotating one needs a
#  # control-plane restart. google/github/githubApp get built-in https endpoints;
#  # generic needs authURL and tokenURL. authURL/tokenURL carry no query string.
#  # allowedScopes is the cap no agent or portal request can exceed.
#  providers:
#    - id: google
#      type: google
#      clientID: 1234.apps.googleusercontent.com
#      clientSecretKey: oauth-clients/google
#      allowedScopes: [openid, email, https://www.googleapis.com/auth/drive.readonly]
#      defaultScopes: [openid, email]
#      allowedAccountDomains: [example.com]
#      requireEmailMatch: true
#  connect:
#    redirectURL: https://localhost:7070/connect/callback  # same origin as oidc.redirectURL; default derived
#    pendingTTL: 15m                        # 1m-1h

# Worker CA (CONTROL PLANE ONLY, never served to workers; docs/control-plane.md "Worker CA").
# The compose recipe's cp-bootstrap service creates the chain and key below with
# `warden control-plane ca init` into the cp-ca volume. keySource: file is DEVELOPMENT
# ONLY (the intermediate key is a plain file); production uses keySource: keys.
workerCA:
  enabled: true
  trustDomain: warden.local
  certFile: /ca/intermediate-chain.pem
  keySource: file
  keyFile: /ca/intermediate.key
