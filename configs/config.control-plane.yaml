# Warden control-plane policy.
#
# This is the policy every data-plane worker pulls and enforces. It is
# ALLOW/DENY ONLY: the control plane never holds or serves secrets — those stay
# on each worker. Edit this file and workers pick up the change on their next
# poll (no restart). The control plane re-reads it on each request.

policy:
  allowlist:
    - domain: api.github.com
    - domain: "~.*\\.githubusercontent\\.com$"
  denylist:
    - domain: evil.example.com

logging:
  level: info
  format: json

# Identity verification (OFF when this block is absent: no token is read or
# verified and behavior is byte-identical to before). Attribute mode verifies a
# user token and records who made the request; it never blocks. The block holds
# no secrets. Phase 1 modes: off | attribute ("require" arrives in Phase 2).
# Per-agent override: `identity: off|attribute` on an agents[] entry.
#identity:
#  defaultMode: attribute                  # off | attribute (default off)
#  issuer: http://localhost:5556/dex       # dev only: plain http needs internalIssuerURL
#  internalIssuerURL: http://dex:5556      # dev-only split-horizon: origin containers use to reach the issuer
#  audience: warden
#  allowedAZP: [agent-harness, warden-cli] # empty = no azp check
#  groupsClaim: groups
#  clockSkewSeconds: 60                    # 0..300 (0 = default 60)
#  maxTokenTTLSeconds: 3600                # >0 overrides the default 3600

# Production form: an
# https issuer and no internalIssuerURL. The block holds no secrets.
#identity:
#  defaultMode: attribute                  # off | attribute (default off)
#  issuer: https://idp.example.com
#  audience: warden
#  allowedAZP: [agent-harness, warden-cli] # empty = no azp check
#  groupsClaim: groups

# Console sign-in (CP-LOCAL; read from this --config file only, never served to
# workers, and edits to the --state-dir copy are ignored). Absent block means
# `auth: none`: today's behaviour (open reads, dashboard writes gated by the admin
# bearer), with a startup warning; --require-console-auth refuses to start in it.
# `auth: oidc` needs --state-dir and the client-secret env var; every human route
# (/dashboard/*, /central/secrets) then needs a session and the shared bearer
# opens none of them. The block holds the env var NAME, never the secret.
# Defaults: clientID warden-console, scopes [openid, email, profile, groups],
# session idle 1h / absolute 12h (0 < idle <= absolute <= 168h). Group matching
# is exact and case-sensitive; the highest matching role wins. Changing this
# block needs a control-plane restart.
#
# Production form (https issuer):
#console:
#  auth: oidc                              # none | oidc (default none)
#  oidc:
#    issuer: https://idp.example.com
#    clientID: warden-console
#    clientSecretEnv: WARDEN_CONSOLE_CLIENT_SECRET
#    redirectURL: https://warden.example.com/auth/callback  # must end in /auth/callback
#  roles:
#    admin: [warden-admins]                # at least one admin group
#    editor: [warden-editors]
#    viewer: [warden-viewers]
#  session:
#    idle: 1h
#    absolute: 12h
#
# Compose dev profile (Dex): the CP runs in a container where `localhost` is
# itself, so the browser-facing issuer stays public and internalIssuerURL names
# the origin the CP reaches the IdP on. Matches the warden-console Dex client.
#console:
#  auth: oidc
#  oidc:
#    issuer: http://localhost:5556/dex
#    internalIssuerURL: http://dex:5556
#    clientID: warden-console
#    clientSecretEnv: WARDEN_CONSOLE_DEX_CLIENT_SECRET
#    redirectURL: https://localhost:7070/auth/callback
#  roles:
#    admin: [warden-admins]
