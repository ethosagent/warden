# Parser for docs/siem/fluent-bit.conf: one JSON object per line. ts is the
# producer's wall clock (UTC, RFC 3339, nanoseconds) and becomes the record
# time; the field itself stays in the record.
[PARSER]
    Name         warden_json
    Format       json
    Time_Key     ts
    Time_Format  %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep    On
