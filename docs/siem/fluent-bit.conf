# Fluent Bit pipeline for Warden's JSON audit streams.
# Guide: docs/siem.md. Run: fluent-bit -c docs/siem/fluent-bit.conf
#
# It tails the files audit.jsonLog writes (output: file), parses each line as
# JSON, and rewrites the tag from the top-level "schema" field so the worker's
# decision lines (warden.decision.v1) and the control plane's admin lines
# (warden.admin.v1) can go to different outputs. Paths come from the
# environment: WARDEN_AUDIT_GLOB (files to tail) and WARDEN_FLB_DB (offset
# database, a writable path).
#
# The outputs at the end print to the console so the file works with no SIEM
# attached. Replace them with your output plugin (docs/siem.md, "Fluent Bit").

[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  warden-parsers.conf

[INPUT]
    Name              tail
    Tag               warden.raw
    Path              ${WARDEN_AUDIT_GLOB}
    Parser            warden_json
    DB                ${WARDEN_FLB_DB}
    Read_from_Head    On
    Refresh_Interval  5
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   Off

# One rule per schema. keep=false drops the warden.raw copy; a line with an
# unknown schema keeps the warden.raw tag and falls to the last output.
[FILTER]
    Name    rewrite_tag
    Match   warden.raw
    Rule    $schema ^warden\.decision\.v1$ warden.decision false
    Rule    $schema ^warden\.admin\.v1$    warden.admin    false

[OUTPUT]
    Name    stdout
    Match   warden.decision
    Format  json_lines

[OUTPUT]
    Name    stdout
    Match   warden.admin
    Format  json_lines

# Lines with a schema this file does not know (for example a future
# warden.decision.v2) arrive here under the original tag.
[OUTPUT]
    Name    stdout
    Match   warden.raw
    Format  json_lines
